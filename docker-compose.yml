services:
  db:
    image: postgres:15
    container_name: music_db
    restart: always
    env_file:
      - config/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    env_file:
      - config/.env
    container_name: music_app
    restart: always
    depends_on:
      - db
    volumes:
      - .:/app
    command: tail -f /dev/null

volumes:
  postgres_data:
